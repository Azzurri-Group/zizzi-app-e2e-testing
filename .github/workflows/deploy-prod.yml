name: Deploy to production

on:
  release:
    types:
      - created
  repository_dispatch:
    types: [deploy_prod]

jobs:
  test:
    name: Run tests and linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '16.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@azzurri-group'
      - name: Authenticate with Github Package Registry
        run: npm config set '//npm.pkg.github.com/:_authToken' "${NPM_AUTH_TOKEN}"
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - name: Install dependencies
        run: npm i
      - name: Run lint
        run: npm run lint
      - name: Run all tests
        run: npm test

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Docker build and push image to ECR
        id: build-image
        env:
          AWS_ECR_ACCOUNT_URL: ${{ secrets.AWS_ECR_ACCOUNT_URL }}/azzurri-project-name
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg NPM_AUTH_TOKEN=$NPM_AUTH_TOKEN -t $AWS_ECR_ACCOUNT_URL:prod .
          docker tag $AWS_ECR_ACCOUNT_URL:prod $AWS_ECR_ACCOUNT_URL:$IMAGE_TAG
          docker push $AWS_ECR_ACCOUNT_URL:prod
          docker push $AWS_ECR_ACCOUNT_URL:$IMAGE_TAG
      - name: Update Task Definition and restart ECS service
        env:
          AWS_ECR_ACCOUNT_URL: ${{ secrets.AWS_ECR_ACCOUNT_URL }}/azzurri-project-name
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo $AWS_ECR_ACCOUNT_URL:$IMAGE_TAG
          echo "Updating Task Definition..."
          TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition "azzurri-project-name-prod" --region eu-west-1)
          echo $TASK_DEFINITION
          echo "Updating Container Definition..."
          NEW_CONTAINER_DEFINITION=$(echo $TASK_DEFINITION | jq --arg IMAGE "$AWS_ECR_ACCOUNT_URL:$IMAGE_TAG" '.taskDefinition.containerDefinitions[0].image = $IMAGE | .taskDefinition.containerDefinitions[0]')
          echo [$NEW_CONTAINER_DEFINITION]
          echo "Registering new container definition..."
          aws ecs register-task-definition --family azzurri-project-name-prod --region eu-west-1 --requires-compatibilities "FARGATE" --network-mode "awsvpc" --cpu 2048 --container-definitions "[$NEW_CONTAINER_DEFINITION]" --execution-role-arn ecsTaskExecutionRole --memory 4096
          echo "Updating the service..."
          aws ecs update-service --region eu-west-1 --cluster "azzurri-project-prod" --service "azzurri-project-name"  --task-definition "azzurri-project-name-prod"

  trigger-sandbox:
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - name: Trigger sandbox
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          echo "Running curl to trigger sandbox"
          curl -v -X POST -u "and:$DISPATCH_TOKEN" -H "Accept: application/vnd.github.everest-preview+json" -H "Content-Type: application/json" --data '{"event_type":"deploy_sandbox"}' https://api.github.com/repos/azzurri-group/project-name/dispatches
